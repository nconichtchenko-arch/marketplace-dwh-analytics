version: 2

models:
  - name: fct_sales
    description: "Витрина агрегированных продаж по чекам и товарам"
    columns:
      - name: invoice_no
        description: "Номер счета"
        tests:
          - not_null
      - name: stock_code
        description: "Код товара"
        tests:
          - not_null
      - name: total_revenue
        description: "Общая выручка"
        tests:
          - not_null
